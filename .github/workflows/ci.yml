name: CI

# The repo had issue and PR templates but no workflow at all, so nothing ever ran the
# typecheck, the tests, or the layer rules. Every check below already passes locally;
# this is what stops them silently rotting.
on:
  push:
    branches: [main, restructure]
  pull_request:
  workflow_dispatch:

jobs:
  studio:
    name: studio (typecheck · test · build · layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: studio

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # See studio/.dependency-cruiser.cjs for what the layers mean.
      - name: Layer boundaries
        run: npm run depcruise

      - name: Build
        run: npm run build

  gos:
    name: gos (rust core · exports in MuJoCo · python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Rust
        run: rustup target add wasm32-unknown-unknown

      - name: Core tests
        run: cargo test --release
        working-directory: gos

      - name: Build core
        run: python gos/build.py

      - name: Python packages
        run: pip install mujoco numpy pytest mink daqp eclipse-zenoh websockets mcap

      - name: GOS tests
        run: python -m pytest gos/python/tests -q
        env:
          PYTHONPATH: gos/python

      - name: Studio packages
        run: npm install --no-audit --no-fund
        working-directory: studio

      - name: Exports work in real MuJoCo
        run: |
          (cd studio && npx tsx tools/bench/mjcfCases.ts "$RUNNER_TEMP/mj")
          python tools/test_mjcf.py "$RUNNER_TEMP/mj"
