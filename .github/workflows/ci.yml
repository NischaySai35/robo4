name: CI

# The repo had issue and PR templates but no workflow at all, so nothing ever ran the
# typecheck, the tests, or the layer rules. Every check below already passes locally;
# this is what stops them silently rotting.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  studio:
    name: studio (typecheck · test · build · layers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install
        run: npm install --no-audit --no-fund
        working-directory: studio

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      # See studio/.dependency-cruiser.cjs for what the layers mean.
      - name: Layer boundaries
        run: npm run depcruise

      - name: Build
        run: npm run build
