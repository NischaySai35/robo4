[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# "gos" on PyPI is not checked yet, so nothing is published.
name = "gos-robotics"
version = "0.1.0"
description = "GOS: the graph engine under TETROBOT, usable with no window"
requires-python = ">=3.12"
# The core (graph engine, messaging, the gos command) needs only numpy; physics and the rest are add-ons.
dependencies = ["numpy"]

[project.optional-dependencies]
ik = ["mink", "daqp"]
network = ["eclipse-zenoh", "cryptography", "pyserial"]
studio = ["websockets"]
record = ["mcap"]
ros = ["xacro"]
# mujoco 3.12 exactly: Isaac Sim 6.2 (its Newton 1.6.1 + mujoco-warp 3.12) pins it; 9 Nov 4.0 broke Newton's MuJoCo solver
sim = ["mujoco==3.12.0", "scipy", "gymnasium", "pillow", "opencv-python-headless"]
all = ["gos-robotics[ik,network,studio,record,sim,ros]"]

[project.scripts]
gos = "gos.__main__:main"

[tool.setuptools.packages.find]
include = ["gos*"]

[tool.setuptools.package-data]
gos = ["_native/*", "interfaces/*"]

[tool.pytest.ini_options]
# two outside pytest plugins use old pytest names (not our code): anyio (Isaac Sim 6.2 pins 4.14.2; fixed in 4.16) and
# dash (pulled in by open3d; still in 4.5.0). Re-check when Isaac Sim moves on.
filterwarnings = ["ignore:_pytest.python.CallSpec2 has been renamed:pytest.PytestRemovedIn10Warning",
                  "ignore:The hookimpl pytest_addhooks uses old-style:pytest.PytestRemovedIn10Warning"]
