[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# "gos" on PyPI is not checked yet, so nothing is published.
name = "tetrobot-gos"
version = "0.1.0"
description = "GOS: the graph engine under TETROBOT, usable with no window"
requires-python = ">=3.12"
# The core (graph engine, messaging, the gos command) needs only numpy; physics and the rest are add-ons.
dependencies = ["numpy"]

[project.optional-dependencies]
ik = ["mink", "daqp"]
network = ["eclipse-zenoh", "cryptography"]
studio = ["websockets"]
record = ["mcap"]
ros = ["xacro"]
sim = ["mujoco>=3.17", "scipy", "gymnasium", "pillow", "opencv-python-headless"]
all = ["tetrobot-gos[ik,network,studio,record,sim,ros]"]

[project.scripts]
gos = "gos.__main__:main"

[tool.setuptools.packages.find]
include = ["gos*"]

[tool.setuptools.package-data]
gos = ["_native/*", "interfaces/*"]
